# PLC Address Mapping Configuration (Industrial Modbus TCP Standard)
# Supported types:
# - coil (0xxxx: Read/Write boolean)
# - discrete_input (1xxxx: Read-only boolean)
# - holding_register (4xxxx: Read/Write 16-bit word)
# - input_register (3xxxx: Read-only 16-bit word)

protocol: modbus_tcp
version: "1.0"

machine:
  auto_mode:
    type: discrete_input
    address: 10001
    description: "Machine in AUTO mode (1) or MANUAL (0)"
  running:
    type: discrete_input
    address: 10002
    description: "Machine running active cycle"
  emergency_stop:
    type: discrete_input
    address: 10003
    description: "Physical E-STOP active (Normally Closed or Open per wiring, 1 = E-STOP ACTIVE)"
  alarm_active:
    type: discrete_input
    address: 10004
    description: "General PLC hardware fault or alarm"

conveyor:
  running:
    type: discrete_input
    address: 10010
    description: "Conveyor motor run feedback"
  start_command:
    type: coil
    address: 10
    description: "Command coil to start conveyor"
  stop_command:
    type: coil
    address: 11
    description: "Command coil to stop conveyor"

sensors:
  input_sensor:
    type: discrete_input
    address: 10020
    description: "Optical presence sensor at infeed entry"
  output_sensor:
    type: discrete_input
    address: 10021
    description: "Optical presence sensor at outfeed discharge"

# Standard Industrial Command Handshake Registers
handshake:
  call_request:
    type: coil
    address: 50
    description: "Web command trigger strobe"
  call_bin_code:
    type: holding_register
    address: 40100
    description: "Numerical bin index or code for called item"
  command_busy:
    type: discrete_input
    address: 10050
    description: "PLC acknowledged and command in execution"
  command_done:
    type: discrete_input
    address: 10051
    description: "PLC completed dispensing / operation"
  command_error:
    type: discrete_input
    address: 10052
    description: "PLC flagged command fault"
  command_error_code:
    type: input_register
    address: 30050
    description: "Error diagnostic code from PLC"

# Bins Definition and Mapping (Da Nang Sorting Conveyor System)
bins:
