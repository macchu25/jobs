    name: "Cửa 1 - Q. Hải Châu"
    product_code: "DISTRICT_HAI_CHAU"
    product_name: "Quận Hải Châu (Màu Đỏ)"
    capacity: 100
    bin_numeric_code: 1
    quantity:
      type: holding_register
      address: 40001
    sensor:
      type: discrete_input
      address: 10031
    call_command:
      type: coil
      address: 101
    pusher_extend:
